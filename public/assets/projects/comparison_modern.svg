<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="modern_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent_bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="1000" height="650" fill="url(#modern_grad)" />
  <g transform="translate(60, 60)">
    <!-- Modern Sleek Frame -->
    <rect width="880" height="530" rx="16" fill="#111827" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" />
    
    <!-- Clean Minimalist Header -->
    <g transform="translate(40, 40)">
      <circle cx="16" cy="16" r="16" fill="url(#accent_bar)" />
      <text x="44" y="23" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="700" font-size="20" letter-spacing="1">NEXUS DYNAMICS</text>
      <text x="500" y="23" fill="#94a3b8" font-family="sans-serif" font-size="14">Work · Architecture · System · Contact</text>
      <rect x="730" y="2" width="110" height="34" rx="8" fill="url(#accent_bar)" />
      <text x="785" y="23" fill="#000000" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="middle">Book Session</text>
    </g>

    <!-- Hero Content -->
    <g transform="translate(40, 130)">
      <text x="0" y="40" fill="#f8fafc" font-family="'Outfit', sans-serif" font-weight="800" font-size="38">Engineered for Velocity &amp; Clarity.</text>
      <text x="0" y="80" fill="#94a3b8" font-family="sans-serif" font-size="16">Rebuilt from ground zero by Santosh Kumar Bheel with React 19, Node.js &amp; Tailwind CSS.</text>

      <g transform="translate(0, 140)">
        <rect width="250" height="150" rx="12" fill="#1e293b" stroke="#334155" />
        <text x="24" y="50" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="700">99.8%</text>
        <text x="24" y="85" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">Performance Index</text>
        <text x="24" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">Edge-cached asset delivery</text>
      </g>

      <g transform="translate(280, 140)">
        <rect width="250" height="150" rx="12" fill="#1e293b" stroke="#334155" />
        <text x="24" y="50" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="700">+185%</text>
        <text x="24" y="85" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">Client Inbound Lead Flow</text>
        <text x="24" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">Frictionless booking funnels</text>
      </g>

      <g transform="translate(560, 140)">
        <rect width="240" height="150" rx="12" fill="#1e293b" stroke="#334155" />
        <text x="24" y="50" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="700">0.3s</text>
        <text x="24" y="85" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">First Contentful Paint</text>
        <text x="24" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">Zero CLS, zero bloat</text>
      </g>
    </g>
  </g>
</svg>
