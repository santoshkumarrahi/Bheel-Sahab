<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_lumina" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glow_lumina" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="mesh" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg_lumina)" />
  <rect width="1200" height="750" fill="url(#mesh)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="750" />
    <line x1="300" y1="0" x2="300" y2="750" />
    <line x1="500" y1="0" x2="500" y2="750" />
    <line x1="700" y1="0" x2="700" y2="750" />
    <line x1="900" y1="0" x2="900" y2="750" />
    <line x1="1100" y1="0" x2="1100" y2="750" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Editorial Browser Window Mockup -->
  <g transform="translate(120, 100)">
    <rect width="960" height="550" rx="16" fill="#111827" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    
    <!-- Top Bar -->
    <rect width="960" height="48" rx="16" fill="#1f2937" />
    <rect y="32" width="960" height="16" fill="#1f2937" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />
    <rect x="280" y="12" width="400" height="24" rx="6" fill="#0b0f17" />
    <text x="480" y="28" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">lumina-creative.studio</text>

    <!-- Canvas Inner -->
    <g transform="translate(40, 75)">
      <!-- Brand Logo in Canvas -->
      <path d="M 0 20 L 25 0 L 50 20 L 25 40 Z" fill="url(#glow_lumina)" />
      <text x="65" y="27" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" letter-spacing="2">LUMINA</text>

      <text x="0" y="110" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="44" letter-spacing="-1">CINEMATIC DIGITAL</text>
      <text x="0" y="160" fill="url(#glow_lumina)" font-family="'Outfit', sans-serif" font-weight="800" font-size="44" letter-spacing="-1">EXPERIENCES & ART</text>

      <text x="0" y="210" fill="#94a3b8" font-family="sans-serif" font-size="16" max-width="450">Handcrafted digital identities and modern web platforms built for visionaries.</text>

      <!-- Mockup Bento Cards -->
      <g transform="translate(480, 20)">
        <rect width="400" height="220" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="200" cy="110" r="60" fill="none" stroke="url(#glow_lumina)" stroke-width="4" stroke-dasharray="8 4" />
        <text x="200" y="116" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">REEL 2026</text>
      </g>

      <g transform="translate(0, 260)">
        <rect width="260" height="120" rx="10" fill="#1e293b" />
        <text x="24" y="45" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700">140%</text>
        <text x="24" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="13">Mobile Conversion Growth</text>
      </g>

      <g transform="translate(280, 260)">
        <rect width="260" height="120" rx="10" fill="#1e293b" />
        <text x="24" y="45" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700">0.4s</text>
        <text x="24" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="13">Average Edge Render Latency</text>
      </g>

      <g transform="translate(560, 260)">
        <rect width="320" height="120" rx="10" fill="#1e293b" />
        <text x="24" y="45" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700">100/100</text>
        <text x="24" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="13">Google Lighthouse Performance</text>
      </g>
    </g>
  </g>
</svg>
