<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="aura_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14211a" />
      <stop offset="100%" stop-color="#0a130f" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#aura_bg)" />

  <g transform="translate(150, 100)">
    <!-- Packaging Mockup Frame -->
    <rect width="900" height="550" rx="20" fill="#1b2a22" stroke="rgba(252, 211, 77, 0.2)" stroke-width="2" />
    
    <!-- Botanical Monogram -->
    <g transform="translate(450, 160)">
      <circle cx="0" cy="0" r="70" fill="none" stroke="url(#gold)" stroke-width="2" />
      <path d="M 0 -45 Q 25 -10 0 25 Q -25 -10 0 -45 Z" fill="url(#gold)" />
      <text x="0" y="55" fill="url(#gold)" font-family="'Cinzel', serif, Georgia" font-size="28" font-weight="bold" letter-spacing="6" text-anchor="middle">AURA</text>
      <text x="0" y="80" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="4" text-anchor="middle">BOTANICALS · ORGANIC FORMULATIONS</text>
    </g>

    <!-- Brand Palette swatches -->
    <g transform="translate(100, 360)">
      <rect x="0" y="0" width="120" height="60" rx="8" fill="#14211a" stroke="#2d4a3b" />
      <text x="60" y="80" fill="#a7f3d0" font-family="monospace" font-size="11" text-anchor="middle">DEEP FOREST</text>

      <rect x="140" y="0" width="120" height="60" rx="8" fill="#fcd34d" />
      <text x="200" y="80" fill="#fcd34d" font-family="monospace" font-size="11" text-anchor="middle">SOLAR GOLD</text>

      <rect x="280" y="0" width="120" height="60" rx="8" fill="#f5f5f4" />
      <text x="340" y="80" fill="#e7e5e4" font-family="monospace" font-size="11" text-anchor="middle">RAW LINEN</text>

      <rect x="420" y="0" width="120" height="60" rx="8" fill="#2d4a3b" />
      <text x="480" y="80" fill="#6ee7b7" font-family="monospace" font-size="11" text-anchor="middle">SAGE WEAVE</text>

      <rect x="560" y="0" width="140" height="60" rx="8" fill="#0a130f" stroke="#2d4a3b" />
      <text x="630" y="80" fill="#9ca3af" font-family="monospace" font-size="11" text-anchor="middle">STARK NOCTURNE</text>
    </g>
  </g>
</svg>
